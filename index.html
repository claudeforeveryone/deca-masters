<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>DECA Masters: practise for DECA exams and roleplays</title>
    <meta
      name="description"
      content="Cluster-exam drills, roleplay prep and vocab for DECA members. An independent study tool made by students, not affiliated with DECA Inc."
    />
    <meta name="theme-color" content="#071634" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply this device's theme choice before first paint. src/lib/theme.ts owns the key; keep them in step.
      try {
        var t = localStorage.getItem("deca-masters:pref:theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
